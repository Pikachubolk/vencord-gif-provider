name: Build, Validate & Release Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Checkout Vencord
        uses: actions/checkout@v4
        with:
          repository: Vendicated/Vencord
          path: vencord

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vencord dependencies
        working-directory: vencord
        run: pnpm install --no-frozen-lockfile

      - name: Copy plugin to userplugins
        run: |
          mkdir -p vencord/src/userplugins/GifProvider
          cp plugin/index.ts vencord/src/userplugins/GifProvider/

      - name: Build Vencord with plugin
        working-directory: vencord
        run: pnpm build

      - name: Validate build success
        run: |
          if [ -d "vencord/dist" ]; then
            echo "✅ Build successful! Plugin compiles correctly with Vencord."
          else
            echo "❌ Build failed!"
            exit 1
          fi

      - name: Create plugin package
        run: |
          mkdir -p artifact/GifProvider
          cp plugin/index.ts artifact/GifProvider/
          cp plugin/README.md artifact/
          echo "Place the GifProvider folder in your Vencord src/userplugins/ directory" > artifact/INSTALL.txt
          cd artifact && zip -r ../GifProvider-plugin.zip .

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: GifProvider-plugin
          path: |
            artifact/GifProvider/
            artifact/README.md
            artifact/INSTALL.txt

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: GifProvider-plugin-zip
          path: GifProvider-plugin.zip

      # ── Auto-release on push to main ──
      - name: Read version from package.json
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: version
        run: |
          VERSION=$(node -p "require('./plugin/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION"

      - name: Check if tag already exists
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: tag_check
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Tag $TAG already exists, skipping release"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "🏷️ Tag $TAG is new, will create release"
          fi

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: GifProvider ${{ steps.version.outputs.tag }}
          body: |
            ## GifProvider ${{ steps.version.outputs.tag }}

            ### Installation
            1. Download `GifProvider-plugin.zip` below
            2. Extract the `GifProvider` folder into your Vencord `src/userplugins/` directory
            3. Rebuild Vencord with `pnpm build`
            4. Restart Discord

            ---
            *Auto-generated release from commit ${{ github.sha }}*
          files: GifProvider-plugin.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
